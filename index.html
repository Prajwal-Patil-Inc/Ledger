<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2430">
<title>Ledger - Personal Finance</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<style>
:root{
  --ink:#1B2430;
  --ink-soft:#3C4757;
  --paper:#F5F3EE;
  --paper-raised:#FFFFFF;
  --green:#2F7A5C;
  --green-bg:#E4EFE9;
  --brick:#B4432F;
  --brick-bg:#F6E6E2;
  --gold:#C99A3A;
  --gold-bg:#F5EBD4;
  --hairline:#DDD8CC;
  --text-dim:#7A7568;
  --radius:14px;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --serif: ui-serif, Georgia, "Times New Roman", serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
h1,h2,h3{font-family:var(--serif); font-weight:600; margin:0;}
button{font-family:inherit;}
.app{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  background:var(--paper);
  position:relative;
  padding-bottom:calc(150px + env(safe-area-inset-bottom));
}

/* ---- Top bar ---- */
.topbar{
  position:sticky; top:0; z-index:20;
  background:var(--ink);
  color:var(--paper);
  padding:calc(14px + env(safe-area-inset-top)) 18px 14px;
  display:flex; flex-direction:column; gap:10px;
}
.topbar-row{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.brand{display:flex; align-items:center; gap:9px;}
.brand-mark{width:24px;height:24px;border-radius:6px;background:var(--paper);position:relative; flex:0 0 auto;}
.brand-mark::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--ink);}
.brand-mark::after{content:"";position:absolute;left:11px;right:4px;top:11px;height:2px;background:var(--gold);}
.brand h1{font-size:19px; letter-spacing:.2px;}
.icon-btn{
  width:36px;height:36px;border-radius:50%;border:1px solid rgba(245,243,238,.25);
  background:transparent; color:var(--paper); display:flex; align-items:center; justify-content:center;
  cursor:pointer;
}
.icon-btn svg{width:18px;height:18px;}
.month-switch{
  display:flex; align-items:center; justify-content:space-between;
  background:rgba(245,243,238,.08); border-radius:10px; padding:4px 6px;
}
.month-switch button{
  background:none;border:none;color:var(--paper);width:34px;height:34px;border-radius:8px;
  font-size:18px; cursor:pointer; display:flex;align-items:center;justify-content:center;
}
.month-switch button:active{background:rgba(245,243,238,.15);}
.month-label{font-family:var(--serif); font-size:15px; text-align:center; flex:1;}
.month-label .yr{color:var(--gold); font-size:12px; margin-left:4px; font-family:var(--sans);}

/* ---- Tabs content ---- */
.view{padding:18px; display:none; flex:1;}
.view.active{display:block;}

/* ---- Hero ---- */
.hero{
  padding:22px 4px 18px;
  border-bottom:1px solid var(--hairline);
  margin-bottom:18px;
}
.hero-label{font-size:12.5px; color:var(--text-dim); margin-bottom:6px;}
.hero-amount{font-family:var(--serif); font-size:44px; line-height:1; letter-spacing:-.5px;}
.hero-amount.neg{color:var(--brick);}
.hero-sub{display:flex; gap:16px; margin-top:12px; font-size:13px; color:var(--ink-soft);}
.hero-sub b{color:var(--ink); font-weight:600;}
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:20px;
  font-size:12.5px; font-weight:600; margin-top:12px;
}
.chip.green{background:var(--green-bg); color:var(--green);}
.chip.gold{background:var(--gold-bg); color:#8a6a1f;}
.chip.brick{background:var(--brick-bg); color:var(--brick);}
.chip-dot{width:7px;height:7px;border-radius:50%;background:currentColor;}

/* ---- KPI grid ---- */
.kpi-grid{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--hairline); border:1px solid var(--hairline); border-radius:var(--radius); overflow:hidden; margin-bottom:22px;}
.kpi{background:var(--paper-raised); padding:13px 14px;}
.kpi-label{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.4px; margin-bottom:5px;}
.kpi-value{font-size:19px; font-weight:600; font-family:var(--serif);}
.kpi-value.small{font-size:15px;}

/* ---- Section headers ---- */
.section-head{display:flex; align-items:baseline; justify-content:space-between; margin:26px 0 10px;}
.section-head h2{font-size:15px;}
.section-head .hint{font-size:12px; color:var(--text-dim);}

/* ---- Donut chart ---- */
.donut-wrap{display:flex; align-items:center; gap:18px; padding:6px 0 4px;}
.donut-legend{flex:1; display:flex; flex-direction:column; gap:7px; min-width:0;}
.legend-row{display:flex; align-items:center; gap:8px; font-size:12.5px;}
.legend-swatch{width:9px;height:9px;border-radius:2px; flex:0 0 auto;}
.legend-name{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink-soft);}
.legend-pct{color:var(--text-dim); font-variant-numeric:tabular-nums;}

/* ---- Insights ---- */
.insight-row{
  padding:11px 0; border-bottom:1px solid var(--hairline); font-size:13.5px; color:var(--ink-soft); line-height:1.45;
}
.insight-row:last-child{border-bottom:none;}
.insight-row.warn{color:var(--brick); font-weight:600;}
.insight-row.ok{color:var(--green); font-weight:600;}

/* ---- Ledger list rows (expenses/bills) ---- */
.ledger-list{border-top:1px solid var(--hairline);}
.ledger-row{
  display:flex; align-items:center; gap:12px; padding:13px 2px;
  border-bottom:1px solid var(--hairline);
}
.ledger-main{flex:1; min-width:0;}
.ledger-cat{font-size:14.5px; font-weight:600;}
.ledger-meta{font-size:12px; color:var(--text-dim); margin-top:2px; display:flex; gap:6px; flex-wrap:wrap;}
.tag{display:inline-block; padding:1px 7px; border-radius:8px; font-size:10.5px; font-weight:600;}
.tag.fixed{background:var(--gold-bg); color:#8a6a1f;}
.tag.variable{background:#E9E5F5; color:#5b4d99;}
.ledger-amount{font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap;}
.paid-btn{
  border:1px solid var(--hairline); background:var(--paper-raised); border-radius:8px;
  font-size:11px; font-weight:600; padding:5px 9px; cursor:pointer; white-space:nowrap;
}
.paid-btn.yes{background:var(--green-bg); color:var(--green); border-color:transparent;}
.paid-btn.no{background:var(--brick-bg); color:var(--brick); border-color:transparent;}
.ledger-row.overdue{background:linear-gradient(90deg, rgba(180,67,47,.06), transparent);}
.ledger-row.due-soon{background:linear-gradient(90deg, rgba(201,154,58,.10), transparent);}
.empty-state{
  text-align:center; padding:40px 20px; color:var(--text-dim);
}
.empty-state h3{font-size:16px; color:var(--ink); margin-bottom:6px;}
.empty-state p{font-size:13.5px; line-height:1.5; margin:0 0 16px;}

.list-total{display:flex; justify-content:space-between; padding:14px 2px 4px; font-size:14px; font-weight:600;}

/* ---- Goals ---- */
.goal-card{padding:16px 2px; border-bottom:1px solid var(--hairline);}
.goal-card:last-child{border-bottom:none;}
.goal-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
.goal-name{font-family:var(--serif); font-size:16px;}
.goal-amounts{font-size:12.5px; color:var(--text-dim);}
.goal-bar-track{height:8px; border-radius:5px; background:var(--hairline); overflow:hidden;}
.goal-bar-fill{height:100%; background:var(--green); border-radius:5px;}
.goal-foot{display:flex; justify-content:space-between; font-size:12px; color:var(--text-dim); margin-top:7px;}

/* ---- Floating action button ---- */
.fab{
  position:fixed; right:20px; bottom:calc(78px + env(safe-area-inset-bottom));
  width:54px;height:54px;border-radius:50%; background:var(--ink); color:var(--paper);
  border:none; font-size:26px; display:flex; align-items:center; justify-content:center;
  box-shadow:0 6px 18px rgba(27,36,48,.35); cursor:pointer; z-index:30;
  max-width:480px;
}
.fab:active{transform:scale(.95);}

/* ---- Bottom tab bar ---- */
.tabbar{
  position:fixed; bottom:0; left:0; right:0; z-index:25;
  max-width:480px; margin:0 auto;
  background:var(--paper-raised); border-top:1px solid var(--hairline);
  display:flex; padding-bottom:env(safe-area-inset-bottom);
}
.tab-btn{
  flex:1; background:none; border:none; padding:10px 4px 8px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--text-dim);
}
.tab-btn svg{width:21px;height:21px;}
.tab-btn span{font-size:10.5px; font-weight:600;}
.tab-btn.active{color:var(--ink);}
.tab-btn.active svg{color:var(--gold);}

/* ---- Modal ---- */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(27,36,48,.45); z-index:50;
  display:none; align-items:flex-end; justify-content:center;
}
.modal-backdrop.open{display:flex;}
.modal{
  background:var(--paper); width:100%; max-width:480px; border-radius:20px 20px 0 0;
  padding:8px 20px calc(20px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto;
  animation:sheet-up .22s ease-out;
}
@keyframes sheet-up{from{transform:translateY(16px); opacity:.4;} to{transform:translateY(0); opacity:1;}}
.modal-handle{width:36px;height:4px;border-radius:3px;background:var(--hairline); margin:8px auto 14px;}
.modal h2{font-size:18px; margin-bottom:16px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:5px; font-weight:600;}
.field input, .field select, .field textarea{
  width:100%; padding:11px 12px; border:1px solid var(--hairline); border-radius:10px;
  font-size:15px; background:var(--paper-raised); color:var(--ink); font-family:inherit;
}
.field textarea{resize:vertical; min-height:50px;}
.field-row{display:flex; gap:10px;}
.field-row .field{flex:1;}
.seg{display:flex; border:1px solid var(--hairline); border-radius:10px; overflow:hidden;}
.seg button{flex:1; padding:10px; background:var(--paper-raised); border:none; font-size:13.5px; font-weight:600; color:var(--text-dim); cursor:pointer;}
.seg button.active{background:var(--ink); color:var(--paper);}
.modal-actions{display:flex; gap:10px; margin-top:6px;}
.btn{
  flex:1; padding:13px; border-radius:10px; border:none; font-size:14.5px; font-weight:600; cursor:pointer;
}
.btn-primary{background:var(--ink); color:var(--paper);}
.btn-ghost{background:none; border:1px solid var(--hairline); color:var(--ink-soft);}
.btn-danger{background:var(--brick-bg); color:var(--brick);}

/* Toast */
.toast{
  position:fixed; left:50%; bottom:calc(90px + env(safe-area-inset-bottom)); transform:translateX(-50%);
  background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:24px; font-size:13px;
  z-index:60; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  max-width:80%; text-align:center;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

.helper-text{font-size:12px; color:var(--text-dim); line-height:1.5; margin:4px 2px 0;}

.amount-input {
  position: relative;
  width: 100%;
}

.amount-input input {
  width: 100%;
  box-sizing: border-box;
  padding-right: 50px;
}

.amount-input button {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);

  width: 34px;
  height: 34px;

  padding: 0;
  border: none;
  border-radius: 8px;

  background: #eee;
  color: #333;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 24px;
  line-height: 1;
  cursor: pointer;
}

/* Add amount section */
.add-amount-area {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  align-items: center;
}

.add-amount-area input {
  flex: 1;
  min-width: 0;
  box-sizing: border-box;
}

.add-amount-area button {
  border: none;
  border-radius: 8px;
  padding: 10px 14px;
  cursor: pointer;
}

#confirm-add {
  background: #222;
  color: white;
}

#cancel-add {
  background: #eee;
  color: #333;
}

.add-amount-area[hidden] {
  display: none;
}



</style>
</head>
<body>
<div class="app" id="app">

  <div class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <div class="brand-mark"></div>
        <h1>Ledger</h1>
      </div>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"></path></svg>
      </button>
    </div>
    <div class="month-switch">
      <button id="prevMonth" aria-label="Previous month">‹</button>
      <div class="month-label" id="monthLabel">August <span class="yr">2026</span></div>
      <button id="nextMonth" aria-label="Next month">›</button>
    </div>
  </div>

  <!-- ===== DASHBOARD ===== -->
  <div class="view active" id="view-dashboard"></div>

  <!-- ===== EXPENSES ===== -->
  <div class="view" id="view-expenses"></div>

  <!-- ===== BILLS ===== -->
  <div class="view" id="view-bills"></div>

  <!-- ===== GOALS ===== -->
  <div class="view" id="view-goals"></div>

  <button class="fab" id="fabBtn" aria-label="Add">+</button>

  <div class="tabbar">
    <button class="tab-btn active" data-tab="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg>
      <span>Dashboard</span>
    </button>
    <button class="tab-btn" data-tab="expenses">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h18M3 12h18M3 17h12"></path></svg>
      <span>Expenses</span>
    </button>
    <button class="tab-btn" data-tab="bills">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M7 2v4M17 2v4M3 10h18"></path></svg>
      <span>Bills</span>
    </button>
    <button class="tab-btn" data-tab="goals">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1"></circle></svg>
      <span>Goals</span>
    </button>
  </div>

</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalBody"></div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
